[package]
name = "qpc-near-contract"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fail-closed NEAR policy authorization contract for QPC agentic routing"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
