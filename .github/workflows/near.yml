name: QPC NEAR Checks

on:
  push:
    branches: ["qpc/**"]
    paths: ["near/**", ".github/workflows/near.yml"]
  pull_request:
    paths: ["near/**", ".github/workflows/near.yml"]

jobs:
  near:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: near
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: near
      - name: Run NEAR workspace tests
        run: cargo test --workspace
      - name: Test QPC NEAR execution proof verifier
        run: cargo test -p qpc-near-proof
      - name: Type-check NEAR contracts for WASM
        run: cargo check --workspace --target wasm32-unknown-unknown
