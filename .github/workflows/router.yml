name: Router boundaries
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse every module and test
        run: find agent-router -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Public API and mocked integration tests
        run: node --test agent-router/test/*.test.mjs
