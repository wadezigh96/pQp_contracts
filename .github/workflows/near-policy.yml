name: QPC NEAR Policy

on:
  push:
    paths:
      - "near/qpc-policy/**"
      - ".github/workflows/near-policy.yml"
  pull_request:
    paths:
      - "near/qpc-policy/**"
      - ".github/workflows/near-policy.yml"

jobs:
  test-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Unit tests
        run: cargo test --manifest-path near/qpc-policy/Cargo.toml
      - name: WASM compile check
        run: cargo check --manifest-path near/qpc-policy/Cargo.toml --target wasm32-unknown-unknown --release
