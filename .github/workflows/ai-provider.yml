name: AI Provider

on:
  push:
    branches: [qpc/near-open-innovation]
    paths:
      - "ai-provider/**"
      - ".github/workflows/ai-provider.yml"
  pull_request:
    paths:
      - "ai-provider/**"
      - ".github/workflows/ai-provider.yml"

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-provider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run offline contract tests
        run: npm test
