name: QPC Agent Router Tests

on:
  push:
    branches: ["qpc/**"]
    paths: ["agent-router/**", ".github/workflows/agent-router.yml"]
  pull_request:
    paths: ["agent-router/**", ".github/workflows/agent-router.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
