name: NEAR contract

on:
  push:
    branches: ["**"]
    paths:
      - "near/qpc-near-agent-finance/**"
      - "near/offline-vm/**"
      - "docs/fixtures/**"
      - ".github/workflows/near-contract.yml"
  pull_request:
    paths:
      - "near/qpc-near-agent-finance/**"
      - "near/offline-vm/**"
      - "docs/fixtures/**"
      - ".github/workflows/near-contract.yml"

permissions:
  contents: read

jobs:
  near-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format sources
        run: cargo fmt --manifest-path near/qpc-near-agent-finance/Cargo.toml -- --check
      - name: Unit tests
        run: cargo test --manifest-path near/qpc-near-agent-finance/Cargo.toml --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned WASM compatibility tooling
        run: npm ci --prefix near/offline-vm --ignore-scripts --no-audit --no-fund
      - name: Build compatible WASM and execute ABI and callbacks in offline VM
        env:
          CARGO_BUILD_JOBS: "1"
        run: bash near/offline-vm/check.sh
