name: QPC Zcash Adapter Checks

on:
  push:
    branches:
      - "qpc/**"
      - "manus/continue-near-zcash"
    paths:
      - "zcash/qpc-zcash-agent/**"
      - ".github/workflows/zcash-adapter.yml"
  pull_request:
    paths:
      - "zcash/qpc-zcash-agent/**"
      - ".github/workflows/zcash-adapter.yml"

permissions:
  contents: read

jobs:
  zcash-adapter:
    name: Zcash address and policy adapter tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zcash/qpc-zcash-agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zcash/qpc-zcash-agent
      - name: Check Rust formatting
        run: cargo fmt --all
      - name: Run adapter tests
        run: cargo test
      - name: Compile adapter
        run: cargo check
