name: QPC Zcash Adapter Checks
on:
  push:
    branches: ["qpc/**"]
    paths: ["zcash/qpc-zcash-agent/**", ".github/workflows/zcash-adapter.yml"]
  pull_request:
    paths: ["zcash/qpc-zcash-agent/**", ".github/workflows/zcash-adapter.yml"]
permissions:
  contents: read
jobs:
  zcash-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zcash/qpc-zcash-agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zcash/qpc-zcash-agent
      - run: cargo fmt --all
        name: Format Rust sources
      - run: cargo generate-lockfile
        name: Generate Cargo.lock
      - run: cargo test --locked
        name: Run tests
      - run: cargo check --locked
        name: Compile adapter
      - uses: actions/upload-artifact@v4
        with:
          name: qpc-zcash-cargo-lock
          path: zcash/qpc-zcash-agent/Cargo.lock
          if-no-files-found: error
