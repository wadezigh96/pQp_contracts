name: QPC Zcash Adapter Checks

on:
  push:
    branches: ["qpc/**"]
    paths:
      - "zcash/qpc-zcash-agent/**"
      - ".github/workflows/zcash-adapter.yml"
  pull_request:
    paths:
      - "zcash/qpc-zcash-agent/**"
      - ".github/workflows/zcash-adapter.yml"

permissions:
  contents: read

jobs:
  zcash-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zcash/qpc-zcash-agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zcash/qpc-zcash-agent
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Generate dependency lockfile
        run: cargo generate-lockfile
      - name: Run adapter tests
        run: cargo test --locked
      - name: Check adapter
        run: cargo check --locked
      - name: Preserve generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: qpc-zcash-cargo-lock
          path: zcash/qpc-zcash-agent/Cargo.lock
          if-no-files-found: error
