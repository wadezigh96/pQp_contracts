[package]
name = "qpc-zcash-agent"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
zcash_address = "=0.13.0"
zcash_protocol = "=0.10.5"
zcash_client_backend = { version = "=0.24.0", features = ["sync", "lightwalletd-tonic", "lightwalletd-tonic-tls-webpki-roots", "lightwalletd-tonic-transport"] }
zcash_client_sqlite = { version = "=0.22.0", features = ["orchard"] }
rusqlite = "=0.37.0"
rand_core = { version = "0.6", features = ["getrandom"] }
tonic = { version = "0.14", features = ["transport", "tls-webpki-roots"] }

[dev-dependencies]
tempfile = "3"
