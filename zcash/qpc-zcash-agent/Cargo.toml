[package]
name = "qpc-zcash-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fail-closed Zcash wallet adapter boundary for QPC agentic payments"

[lib]
path = "src/lib.rs"

[features]
regtest-integration = []

[[test]]
name = "regtest_incoming"
path = "tests/regtest_incoming.rs"
required-features = ["regtest-integration"]

[dependencies]
rand_core = { version = "=0.6.4", features = ["getrandom"] }
sha2 = "=0.10.9"
http = "1"
base64 = "=0.22.1"
serde_json = "=1.0.154"
zeroize = "=1.9.1"
async-trait = "=0.1.92"
tokio = { version = "1", features = ["time", "net", "io-util"] }
zcash_address = "=0.13.0"
zcash_keys = { version = "=0.16.1", default-features = false, features = ["orchard", "sapling"] }
zcash_client_backend = { version = "=0.24.0", default-features = false, features = ["lightwalletd-tonic-tls-webpki-roots", "lightwalletd-tonic-transport", "orchard", "sync"] }
zcash_client_sqlite = { version = "=0.22.0", default-features = false, features = ["orchard"] }
zcash_protocol = { version = "=0.10.6", features = ["local-consensus"] }

[dev-dependencies]
tempfile = "3"
zip32 = "=0.2.1"
